<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ornament Forge — Custom Logo Ornaments &amp; Medallions</title>
<meta name="description" content="Send us your logo and we forge it into a full-color 3D-printed ornament or medallion. Printed to order in Waxhaw, North Carolina." />
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     The print rule is the design rule: every color is flat and
     solid. No gradients, no blurred shadows, no soft edges —
     the page separates into layers exactly like the medallion.
     ============================================================ */
  :root{
    --ink:#0B0B0C;
    --panel:#141416;
    --field:#1C1C1F;
    --bone:#E8E4DC;
    --steel:#9A9A9A;
    --blue:#25579B;
    --blue-hi:#3D7ACC;
    --copper:#EEA159;
    --line:#2A2A2E;
    --line-hi:#3E3E44;
    --ok:#6FBF73;
    --warn:#E2724A;
    --disp:"Archivo Black","Arial Black",sans-serif;
    --body:"Karla",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--ink);color:var(--bone);
    font-family:var(--body);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:-.01em;margin:0}
  .mono{font-family:var(--mono)}

  /* ---------- header ---------- */
